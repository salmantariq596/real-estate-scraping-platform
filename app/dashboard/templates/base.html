<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Pincali ETL Admin{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:       #080d14;
            --bg2:      #0d1520;
            --bg3:      #111d2e;
            --border:   #1a2d44;
            --border2:  #243852;
            --text:     #cdd9e8;
            --text-dim: #4e6a88;
            --text-sub: #2d4a66;
            --accent:   #38bdf8;
            --accent2:  #0ea5e9;
            --green:    #34d399;
            --yellow:   #fbbf24;
            --red:      #f87171;
            --purple:   #a78bfa;
            --font-head: 'Syne', sans-serif;
            --font-body: 'DM Sans', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --radius:   10px;
            --radius-lg: 16px;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--font-body);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            font-size: 14px;
            line-height: 1.6;
        }
        /* Nav */
        nav {
            background: var(--bg2);
            border-bottom: 1px solid var(--border);
            padding: 0 28px;
            height: 56px;
            display: flex;
            align-items: center;
            gap: 4px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .brand {
            font-family: var(--font-head);
            font-weight: 800;
            font-size: 17px;
            color: var(--accent);
            margin-right: 20px;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .brand-dot { width: 8px; height: 8px; background: var(--green); border-radius: 50%; animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(1.3)} }
        nav a {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            padding: 6px 14px;
            border-radius: 8px;
            transition: all 0.15s;
            white-space: nowrap;
        }
        nav a:hover { background: var(--bg3); color: var(--text); }
        nav a.active { background: var(--border2); color: var(--accent); }
        nav .spacer { flex: 1; }
        nav .api-link { color: var(--text-dim); font-size: 12px; font-family: var(--font-mono); border: 1px solid var(--border); padding: 5px 12px; border-radius: 6px; }
        nav .api-link:hover { border-color: var(--accent); color: var(--accent); background: transparent; }
        /* Layout */
        .container { max-width: 1440px; margin: 0 auto; padding: 32px 28px; }
        /* Page header */
        .page-header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 28px; }
        .page-header h1 { font-family: var(--font-head); font-size: 22px; font-weight: 700; color: #f1f5f9; letter-spacing: -0.3px; }
        .page-header .sub { font-size: 13px; color: var(--text-dim); font-weight: 400; }
        .page-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
        /* Cards */
        .card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 24px;
        }
        .card-sm { padding: 16px 20px; }
        /* Grid */
        .grid { display: grid; gap: 16px; }
        .grid-4 { grid-template-columns: repeat(4, 1fr); }
        .grid-3 { grid-template-columns: repeat(3, 1fr); }
        .grid-2 { grid-template-columns: repeat(2, 1fr); }
        @media (max-width: 1100px) { .grid-4 { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 768px) { .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr; } }
        /* Stat cards */
        .stat-card { text-align: center; position: relative; overflow: hidden; }
        .stat-card::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 0%, var(--accent-glow, #38bdf811) 0%, transparent 70%); pointer-events: none; }
        .stat-value { font-family: var(--font-head); font-size: 38px; font-weight: 800; color: var(--stat-color, var(--accent)); line-height: 1; }
        .stat-label { font-size: 11px; color: var(--text-dim); margin-top: 6px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; }
        .stat-sub { font-size: 12px; color: var(--text-sub); margin-top: 8px; }
        /* Table */
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th {
            text-align: left;
            padding: 10px 14px;
            color: var(--text-sub);
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            border-bottom: 1px solid var(--border);
        }
        td { padding: 11px 14px; border-bottom: 1px solid var(--border); color: var(--text); vertical-align: middle; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: var(--bg3); }
        /* Badges */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 9px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.03em;
        }
        .badge-green  { background: #052e1b; color: var(--green);  border: 1px solid #0a5c35; }
        .badge-yellow { background: #2d1f04; color: var(--yellow); border: 1px solid #5c3f08; }
        .badge-red    { background: #2d0a0a; color: var(--red);    border: 1px solid #5c1414; }
        .badge-blue   { background: #051a2e; color: var(--accent); border: 1px solid #0a3860; }
        .badge-purple { background: #1a0e2e; color: var(--purple); border: 1px solid #3d2266; }
        .badge-gray   { background: #111a24; color: #4e6a88;       border: 1px solid #1a2d44; }
        /* Status dot */
        .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
        .dot-green  { background: var(--green); box-shadow: 0 0 6px var(--green); }
        .dot-yellow { background: var(--yellow); }
        .dot-red    { background: var(--red); }
        .dot-gray   { background: #4e6a88; }
        /* Plain text-color utilities -- keeps conditional coloring in class="" instead of inline style="" */
        .text-red   { color: var(--red); }
        .text-green { color: var(--green); }
        .text-sub   { color: var(--text-sub); }
        .text-dim   { color: var(--text-dim); }
        /* Section title */
        .section-title { font-family: var(--font-head); font-size: 15px; font-weight: 700; color: #e2e8f0; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .section-title .count { font-size: 11px; font-family: var(--font-mono); background: var(--bg3); color: var(--text-dim); padding: 2px 8px; border-radius: 4px; border: 1px solid var(--border); }
        /* Empty state */
        .empty { text-align: center; padding: 56px 24px; color: var(--text-sub); }
        .empty-icon { font-size: 36px; margin-bottom: 12px; opacity: .5; }
        /* Refresh badge */
        .refresh-badge { font-family: var(--font-mono); font-size: 11px; color: var(--text-sub); background: var(--bg3); border: 1px solid var(--border); padding: 3px 10px; border-radius: 6px; }
        /* Link */
        a.row-link { color: var(--accent); text-decoration: none; }
        a.row-link:hover { text-decoration: underline; }
        /* Mono text */
        .mono { font-family: var(--font-mono); font-size: 11px; }
        /* Progress bar */
        .progress-track { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: 2px; background: var(--accent); transition: width .3s; }
        /* KV row */
        .kv { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
        .kv:last-child { border-bottom: none; }
        .kv-key { color: var(--text-dim); }
        .kv-val { color: var(--text); font-weight: 500; text-align: right; }
        /* Scroll container */
        .scroll-x { overflow-x: auto; }
        /* Tags */
        .tag { display: inline-block; background: var(--bg3); border: 1px solid var(--border); color: var(--text-dim); font-size: 11px; padding: 2px 8px; border-radius: 4px; margin: 2px; }
    </style>
</head>
<body>
<nav>
    <span class="brand"><span class="brand-dot"></span>Pincali ETL</span>
    <a href="/admin" {% if active == 'dashboard' %}class="active"{% endif %}>Dashboard</a>
    <a href="/admin/listings" {% if active == 'listings' %}class="active"{% endif %}>Listings</a>
    <a href="/admin/runs" {% if active == 'runs' %}class="active"{% endif %}>Scrape Runs</a>
    <a href="/admin/errors" {% if active == 'errors' %}class="active"{% endif %}>Errors</a>
    <a href="/admin/stats" {% if active == 'stats' %}class="active"{% endif %}>Stats</a>
    <a href="/admin/proxies" {% if active == 'proxies' %}class="active"{% endif %}>Proxies</a>
    <span class="spacer"></span>
    <a href="/docs" target="_blank" class="api-link">API Docs ↗</a>
</nav>
<div class="container">
{% block content %}{% endblock %}
</div>
<script>
function autoRefresh(seconds) {
    let remaining = seconds;
    const el = document.getElementById('refresh-countdown');
    if (el) {
        const iv = setInterval(() => {
            remaining--;
            if (el) el.textContent = remaining + 's';
            if (remaining <= 0) { clearInterval(iv); location.reload(); }
        }, 1000);
    } else {
        setTimeout(() => location.reload(), seconds * 1000);
    }
}
</script>
</body>
</html>
